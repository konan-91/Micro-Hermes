[package]
name = "hermes"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
hermes-common = { path = "../hermes-common" }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true, default-features = true }
clap = { workspace = true }
env_logger = { workspace = true, default-features = true }
libc = { workspace = true, default-features = true }
log = { workspace = true }
signal-hook = { workspace = true, default-features = true, features = ["iterator"] }

[build-dependencies]
anyhow = { workspace = true, default-features = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true, default-features = true }
# TODO(https://github.com/rust-lang/cargo/issues/12375): this should be an artifact dependency, but
# it's not possible to tell cargo to use `-Z build-std` to build it. We cargo-in-cargo in the build
# script to build this, but we want to teach cargo about the dependency so that cache invalidation
# works properly.
hermes-ebpf = { path = "../hermes-ebpf" }

[[bin]]
name = "hermes"
path = "src/main.rs"
