[workspace]
resolver = "2"
members = [
    "hermes",
    "hermes-common",
    "hermes-ebpf",
    "hermes-bench",
]
# hermes-ebpf is excluded from default-members: it requires the nightly
# toolchain + rust-src + bpf-linker (see README) and only builds on Linux.
# Plain `cargo build`/`cargo check` at the workspace root should not require
# any of that just to touch the host-side crates.
default-members = ["hermes", "hermes-common", "hermes-bench"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2021"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
clap = { version = "4.5", default-features = false, features = ["std", "derive"] }
env_logger = { version = "0.11", default-features = false }
libc = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
signal-hook = { version = "0.3", default-features = false }
tokio = { version = "1.40", default-features = false }
which = { version = "6.0", default-features = false }

[profile.release.package.hermes-ebpf]
debug = 2
codegen-units = 1
strip = false
