[package]
name = "hermes-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Real-socket load generator for micro-hermes phase 2 (replaces phase 1's in-process generator.rs)"

[dependencies]
hermes-common = { path = "../hermes-common" }

anyhow = { workspace = true, default-features = true }
clap = { workspace = true }
env_logger = { workspace = true, default-features = true }
log = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }

[[bin]]
name = "hermes-bench"
path = "src/main.rs"
